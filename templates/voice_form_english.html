<head>

    <title>Voice Input Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* Basic styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .form-group {
            position: relative;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background-color: #f9f9f9;
        }

        textarea {
            width: 80%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background-color: #f9f9f9;
        }

        .record-btn {
            position: absolute;
            right: -20px;
            top: 65%;
            transform: translateY(-50%);
            background-color: #007bff;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            width: 33px;
            height: 33px;
            transition: background-color 0.3s ease;
        }

        .record-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <script>
        function speakText(labelText) {
            let speech = new SpeechSynthesisUtterance(labelText);
            speech.lang = 'en-US';
            window.speechSynthesis.speak(speech);
        }

        // function startRecognition(fieldId) {
        //     let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        //     recognition.lang = 'en-US';
        //     recognition.start();

        //     recognition.onresult = function (event) {
        //         document.getElementById(fieldId).value = event.results[0][0].transcript;
        //     };

        //     recognition.onerror = function (event) {
        //         console.error('Speech recognition error:', event.error);
        //     };
        // }

        function startRecognition(fieldId) {
            let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'en-US';
            recognition.start();

            let mediaStream; // Store the microphone stream

            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                mediaStream = stream;
            }).catch(error => console.error('Error accessing microphone:', error));

            recognition.onresult = function (event) {
                document.getElementById(fieldId).value = event.results[0][0].transcript;
            };

            recognition.onerror = function (event) {
                console.error('Speech recognition error:', event.error);
            };

            recognition.onend = function () {
                console.log('Speech recognition ended');

                // Stop the microphone stream
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                }
            };
        }

    </script>
    <div class="login-container">
        <h2>Voice Input Form</h2>
        <form id="voiceForm">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name">
                <button type="button" class="record-btn" onclick="startRecognition('name')">
                    <i class="fas fa-microphone"></i>
                </button>
            </div>

            <div class="form-group">
                <label for="dob">DOB:</label>
                <input type="text" id="dob">
                <button type="button" class="record-btn" onclick="startRecognition('dob')">
                    <i class="fas fa-microphone"></i>
                </button>
            </div>

            <div class="form-group">
                <label for="address">Address:</label>
                <input type="text" id="address">
                <button type="button" class="record-btn" onclick="startRecognition('address')">
                    <i class="fas fa-microphone"></i>
                </button>
            </div>

            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone">
                <button type="button" class="record-btn" onclick="startRecognition('phone')">
                    <i class="fas fa-microphone"></i>
                </button>
            </div>

            <div class="form-group">
                <label for="country">Country:</label>
                <input type="text" id="country">
                <button type="button" class="record-btn" onclick="startRecognition('country')">
                    <i class="fas fa-microphone"></i>
                </button>
            </div>

            <!-- New Additional Info Field -->
            <div class="form-group">
                <label for="additionalInfo">Additional Info:</label>
                <textarea id="additionalInfo" rows="3"></textarea>
                <button type="button" class="record-btn" onclick="toggleRecording('additionalInfo', this)">
                    <i class="fas fa-microphone"></i>
                </button>
            </div>

            <div><b>Note :</b> Please click the mic and speak
                <i class='fas fa-volume-up' onclick="speakText('Please click the mic and speak')"
                    style='font-size:15px; cursor: pointer;'></i>
            </div>
        </form>
    </div>

        let mediaRecorder;
        let audioChunks = [];
        let currentField = '';
        let isRecording = false;
        let mediaStream; // Store the media stream

        function toggleRecording(fieldId, btn) {
            if (!isRecording) {
                startRecording(fieldId, btn);
            } else {
                stopRecording(btn);
            }
        }

        function startRecording(fieldId, btn) {
            currentField = fieldId;
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    mediaStream = stream; // Store the stream so we can stop it later
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.start();
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        let audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        sendAudioToServer(audioBlob);

                        // Stop the microphone stream properly
                        mediaStream.getTracks().forEach(track => track.stop());
                    };

                    isRecording = true;
                    btn.innerHTML = '<i class="fas fa-pause"></i>';
                    btn.style.backgroundColor = '#dc3545'; // Change to red when recording
                })
                .catch(error => console.error('Error accessing microphone:', error));
        }

        function stopRecording(btn) {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;

                btn.innerHTML = '<i class="fas fa-microphone"></i>';
                btn.style.backgroundColor = '#007bff'; // Reset button color

                // Stop the microphone stream
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                }
            }
        }



        function sendAudioToServer(audioBlob) {
            let fd = new FormData();
            fd.append("currentField", currentField);
            fd.append("audio", audioBlob);

            $.ajax({
                url: "", // Set the correct backend endpoint
                type: "POST",
                data: fd,
                processData: false,
                contentType: false,
                headers: { 'X-CSRF-Token': "{{ csrf_token }}" },
                success(response) {
                    let text = response['text'];
                    if (text) {
                        document.getElementById(currentField).value = text;
                    } else {
                        console.error("Error:", response.error);
                    }
                }
            });
        }
    </script>
